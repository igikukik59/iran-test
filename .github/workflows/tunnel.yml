name: Secure GitHub Tunnel

on:
  workflow_dispatch:

jobs:
  start-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install Chisel
        run: |
          wget -O chisel.gz "https://github.com/jpillora/chisel/releases/download/v1.11.5/chisel_1.11.5_linux_amd64.gz"
          gunzip chisel.gz
          chmod +x chisel
          echo "✅ Chisel installed"

      - name: Start Chisel Server on Port 443 with Sudo
        run: |
          sudo ./chisel server --port 443 --reverse --auth "u:p" &
          sleep 3
          
          if ./chisel client --auth "u:p" https://127.0.0.1 ping 2>/dev/null; then
              echo "======================================="
              echo "✅ Server is running on HTTPS port 443"
              echo "🔗 Now, run this EXACT command on your laptop:"
              echo "   chisel client --auth u:p https://github.com R:socks"
              echo "======================================="
          else
              echo "Server failed to start"
              exit 1
          fi
          
          sleep 3600
