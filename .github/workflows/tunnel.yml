name: Tunnel over TLS (443)

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install Chisel
        run: |
          wget -O chisel.gz "https://github.com/jpillora/chisel/releases/download/v1.11.5/chisel_1.11.5_linux_amd64.gz"
          gunzip chisel.gz
          chmod +x chisel

      - name: Generate self-signed certificate
        run: |
          openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -days 1 -nodes -subj "/CN=github.com"

      - name: Start Chisel server with TLS on port 443
        run: |
          sudo ./chisel server --port 443 --reverse --auth "u:p" --tls-key key.pem --tls-cert cert.pem &
          sleep 3
          IP=$(curl -s ifconfig.me)
          echo "======================================="
          echo "🌍 RUNNER IP: $IP"
          echo "🔗 Run this on your laptop (PowerShell):"
          echo "   .\chisel.exe client --auth u:p --tls-skip-verify https://$IP R:socks"
          echo "======================================="
          sleep 3600
