name: Simple Tunnel

on:
  workflow_dispatch:

jobs:
  start-server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install Chisel directly from GitHub releases
        run: |
          wget -O chisel.gz "https://github.com/jpillora/chisel/releases/download/v1.11.5/chisel_1.11.5_linux_amd64.gz"
          gunzip chisel.gz
          chmod +x chisel
          echo "✅ Chisel ready"

      - name: Start Chisel Server
        run: |
          ./chisel server --port 9090 --reverse --auth "u:p" &
          sleep 2
          IP=$(curl -s ifconfig.me)
          echo "======================================="
          echo "🌍 Runner IP: $IP"
          echo "🔗 On your laptop run:"
          echo ".\chisel.exe client --auth u:p http://$IP:9090 R:socks"
          echo "======================================="
          sleep 3600
