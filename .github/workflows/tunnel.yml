name: Simple Tunnel

on:
  workflow_dispatch:

jobs:
  start-server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install Chisel on runner (runners have free internet)
        run: |
          curl -fsSL https://raw.githubusercontent.com/jpillora/chisel/master/install.sh | bash

      - name: Start Chisel Server and Show IP
        run: |
          chisel server --port 9090 --reverse --auth "u:p" &
          sleep 3
          IP=$(curl -s ifconfig.me)
          echo "======================================="
          echo "🌍 Runner IP: $IP"
          echo "🔗 On your laptop run:"
          echo ".\chisel.exe client --auth u:p http://$IP:9090 R:socks"
          echo "======================================="
          sleep 3600
