name: Secure GitHub Tunnel

on:
  workflow_dispatch:

jobs:
  start-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install Chisel
        run: |
          wget -O chisel.gz "https://github.com/jpillora/chisel/releases/download/v1.11.5/chisel_1.11.5_linux_amd64.gz"
          gunzip chisel.gz
          chmod +x chisel
          echo "✅ Chisel installed"

      - name: Start Chisel Server on Port 443
        run: |
          sudo ./chisel server --port 443 --reverse --auth "u:p" &
          sleep 3
          echo "======================================="
          echo "✅ Chisel server is listening on port 443"
          echo "🔗 Run this EXACT command on your laptop:"
          echo "   .\chisel.exe client --auth u:p https://github.com R:socks"
          echo "======================================="
          sleep 3600
