name: Secure GitHub Tunnel

on:
  workflow_dispatch:

jobs:
  start-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install Chisel
        run: |
          wget -O chisel.gz "https://github.com/jpillora/chisel/releases/download/v1.11.5/chisel_1.11.5_linux_amd64.gz"
          gunzip chisel.gz
          chmod +x chisel
          echo "✅ Chisel installed"

      - name: Start Chisel Server in Reverse Mode on Port 443
        run: |
          # اجرای سرور روی پورت ۴۴۳ که کاملاً امن و وایت‌لیست شده است
          ./chisel server --port 443 --reverse --auth "u:p" &
          sleep 3
          
          # بررسی سلامت سرور
          if ./chisel client --auth "u:p" http://127.0.0.1:443 ping &> /dev/null; then
              echo "======================================="
              echo "✅ Server is running on standard HTTPS port 443"
              echo "🔗 Now, run this EXACT command on your laptop:"
              echo "   chisel client --auth u:p https://github.com R:socks"
              echo "======================================="
          else
              echo "Server failed to start on port 443"
              exit 1
          fi
          
          # زنده نگه داشتن رانر
          sleep 3600
